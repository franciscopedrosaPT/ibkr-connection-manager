# Registo único das ligações à IBKR (ibkr-connection-manager v0.1.0, 2026-11-24)
# Fonte de verdade: cada bot DEVE usar client IDs só dentro da sua faixa. O monitor confirma que a
# configuração real de cada bot (o ficheiro indicado em `config_check`) bate com este registo.

endpoints:
  tws_live:
    host: 127.0.0.1
    port: 7496
    kind: TWS
    account: live
    critical: true          # há ordens reais a depender disto
    recover:                # v0.3.0: TWS OFFLINE 1050 via IBC (config-live.ini, credenciais só lá)
      cmd: 'C:\IBC\StartTWS.bat'
      process_match: ibctws # só o TWS arrancado pelo IBC (classe ibcalpha.ibc.IbcTws); nunca o tws.exe antigo
      stuck_min: 20         # mais folga: um login à espera do 2FA também tem a porta fechada
      wait_min: 6
      twofa: true           # avisa no Telegram para aprovar o login no IBKR Mobile
  ibg_paper:
    host: 127.0.0.1
    port: 4002
    kind: IBG
    account: paper
    critical: true
    recover:                # v0.2.0: levantar automaticamente via IBC (credenciais só no config do IBC)
      cmd: 'C:\IBC\StartGateway.bat'
      process_match: ibgateway   # identifica o processo do IB Gateway (nunca o TWS live)
      stuck_min: 10         # processo aberto mas porta fechada há ≥10 min → terminar e arrancar de novo
      wait_min: 5           # tempo dado a cada arranque antes de nova tentativa
  tws_paper:                # reserva do forex (fallback) — normalmente desligado
    host: 127.0.0.1
    port: 7497
    kind: TWS
    account: paper
    critical: false

monitor:
  client_id: 90             # CID reservado ao monitor (só leitura)
  interval_s: 60            # verificação TCP
  api_every_n: 5            # verificação pela API (reqCurrentTime) de 5 em 5 ciclos
  down_after_failures: 2    # só alerta depois de N falhas seguidas (evita falsos alarmes)
  # janelas em que uma queda é esperada (reinício diário do TWS/IBG, manutenção IBKR). Hora UTC.
  quiet_windows_utc:
    - "04:45-05:45"         # reset diário dos servidores IBKR (≈ 23:45–00:45 ET)
  recovery:                 # v0.2.0
    enabled: true           # pausar sem editar: criar o ficheiro data/PAUSE_RECOVERY
    max_per_hour: 3

bots:
  - name: Forex — dados
    project: forex-eurusd-analyzer
    endpoint: ibg_paper
    client_ids: [10]
    config_check: {file: "../forex-eurusd-analyzer/.env", key: IBKR_CLIENT_ID}
  - name: Forex — execução paper
    project: forex-eurusd-analyzer
    endpoint: ibg_paper
    client_ids: [43, 44, 45, 46]
    config_check: {file: "../forex-eurusd-analyzer/.env", key: EXECUTION_CLIENT_ID}
  - name: Forex — execução live
    project: forex-eurusd-analyzer
    endpoint: tws_live
    client_ids: [47, 48, 49, 50]
    config_check: {file: "../forex-eurusd-analyzer/.env", key: LIVE_EXECUTION_CLIENT_ID}
  - name: Forex — adopção de ordens manuais (master)
    project: forex-eurusd-analyzer
    endpoint: tws_live
    client_ids: [0]
  - name: Agente TF (ordens na conta paper desde 2026-11-27)
    project: forex-eurusd-analyzer
    endpoint: ibg_paper
    client_ids: [51]
  - name: Agente VB (ordens na conta paper desde 2026-11-27)
    project: forex-eurusd-analyzer
    endpoint: ibg_paper
    client_ids: [52]
  - name: Agente TF — live (só instrumentos em TF_LIVE_SYMBOLS; vazio por defeito)
    project: forex-eurusd-analyzer
    endpoint: tws_live
    client_ids: [53]
  - name: Agente VB — live (só instrumentos em VB_LIVE_SYMBOLS; vazio por defeito)
    project: forex-eurusd-analyzer
    endpoint: tws_live
    client_ids: [54]
  - name: Forex — scripts (sombras, auditorias)
    project: forex-eurusd-analyzer
    endpoint: any
    client_ids: [61, 62, 63, 64]
  - name: Earnings & Dividends
    project: Analyze Earnings and Dividends
    endpoint: tws_live
    client_ids: [42]
    config_check: {file: "../Analyze Earnings and Dividends/.env", key: IBKR_CLIENT_ID}
  - name: Covered Calls (+ notícias)
    project: Analyze covered calls
    endpoint: tws_live
    client_ids: [70, 71]
    config_check: {file: "../Analyze covered calls/config/config.yaml", key: client_id}
  - name: ibkr-connection-manager (monitor)
    project: ibkr-connection-manager
    endpoint: any
    client_ids: [90]
